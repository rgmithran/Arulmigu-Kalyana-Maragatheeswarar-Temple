<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="60%" stop-color="#D4A843" />
      <stop offset="100%" stop-color="#8E691A" />
    </radialGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B0F1A" />
      <stop offset="100%" stop-color="#36050C" />
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="50" cy="50" r="48" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="50" cy="50" r="44" fill="none" stroke="#D4A843" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.7" />

  <!-- Sacred Tamil OM (ௐ) Symbol in Center -->
  <text x="50" y="66" font-family="'Noto Serif Tamil', 'Noto Sans Tamil', serif" font-size="44" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))">ௐ</text>
</svg>
